name: "Monitor DIGEMID - Scraping y Drive"

on:
  schedule:
    - cron: "0 13 */3 * *"
  workflow_dispatch:
    inputs:
      max_paginas:
        description: "Paginas a scrapear (1 = ultimas 10 alertas)"
        required: false
        default: "1"

env:
  PYTHON_VERSION: "3.11"
  TZ: "America/Lima"

jobs:

  scrape:
    name: "1 Scraping DIGEMID"
    runs-on: ubuntu-latest
    outputs:
      excel_name:          ${{ steps.run.outputs.excel_name }}
      total_alertas:       ${{ steps.run.outputs.total_alertas }}
      alertas_inmediatas:  ${{ steps.run.outputs.alertas_inmediatas }}
      alertas_preventivas: ${{ steps.run.outputs.alertas_preventivas }}
      fecha_reporte:       ${{ steps.run.outputs.fecha_reporte }}
      motor_analisis:      ${{ steps.run.outputs.motor_analisis }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl pymupdf
          pip install google-api-python-client google-auth
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install anthropic
            echo "Motor: Claude API"
          else
            echo "Motor: Heuristico"
          fi
      - name: Ejecutar scraper
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_PAGINAS: ${{ github.event.inputs.max_paginas || '1' }}
        run: python3 scripts/run_scraper.py
      - name: Guardar Excel como artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-alertas
          path: /tmp/alertas_digemid_*.xlsx
          retention-days: 30

  upload_drive:
    name: "2 Subir Excel a Google Drive"
    needs: scrape
    runs-on: ubuntu-latest
    if: ${{ always() && needs.scrape.result == 'success' }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Descargar Excel
        uses: actions/download-artifact@v4
        with:
          name: excel-alertas
          path: /tmp/
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: pip install google-api-python-client google-auth
      - name: Subir a Drive
        env:
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          EXCEL_NAME: ${{ needs.scrape.outputs.excel_name }}
        run: python3 scripts/upload_drive.py

  notify_failure:
    name: "3 Notificar fallo"
    needs: [scrape, upload_drive]
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Enviar alerta de fallo
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NOMBRE: "Scraping DIGEMID y Drive"
        run: python3 scripts/notify_failure.py
