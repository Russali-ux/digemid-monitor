name: "Monitor DIGEMID - Alertas Diarias"

on:
  schedule:
    - cron: "0 13 */3 * *"
  workflow_dispatch:
    inputs:
      max_paginas:
        description: "Paginas a scrapear (1 = ultimas 10 alertas)"
        required: false
        default: "1"
      dry_run:
        description: "Dry run (no envia mail)"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"
  TZ: "America/Lima"
  EMAIL_FROM: "conkosafe.ai@gmail.com"
  EMAIL_TO: "finanzas@conkomerco.com,conkosafe.ai@gmail.com,july.maita@conkomerco.com,alex.rodriguez@conkomerco.com,angelica.aguero@conkomerco.com,aron.cortez@conkomerco.com,giancarlos.chafloque@conkomerco.com,vigilanciasanitaria@soltonpharma.com,farmacovigilancia@corval.com.pe,azegarra@soltonpharma.com,fv@corporacioncobefar.com.pe,farmacovigilancia@greyinversiones.com,regulatorios@greyinversiones.com,dtecnica@corporacioncobefar.com.pe,fv.peru@sevenpharma.net,fv1.peru@sevenpharma.net,Regulatory.Peru@sevenpharma.net,farmacovigilancia@qmpharma.com,farmacovigilancia@perulab.com.pe,ricardo.barrantes@perulab.com.pe,patricia.medina@perulab.com.pe,dcardenas@bagoperu.com.pe,iramos@bagoperu.com.pe,jobregon@bagoperu.com.pe,farmacovigilancia@bago.com.pe,srosas@ferrer.com,daranda@ferrer.com,pefarmacovigilancia@ferrer.com"

jobs:

  scrape:
    name: "1 Scraping DIGEMID"
    runs-on: ubuntu-latest
    outputs:
      excel_name:          ${{ steps.run.outputs.excel_name }}
      total_alertas:       ${{ steps.run.outputs.total_alertas }}
      alertas_inmediatas:  ${{ steps.run.outputs.alertas_inmediatas }}
      alertas_preventivas: ${{ steps.run.outputs.alertas_preventivas }}
      fecha_reporte:       ${{ steps.run.outputs.fecha_reporte }}
      motor_analisis:      ${{ steps.run.outputs.motor_analisis }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl pymupdf
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install anthropic
            echo "Motor: Claude API"
          else
            echo "Motor: Heuristico"
          fi
      - name: Ejecutar scraper
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_PAGINAS: ${{ github.event.inputs.max_paginas || '1' }}
        run: python3 scripts/run_scraper.py
      - name: Guardar Excel como artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-alertas
          path: /tmp/alertas_digemid_*.xlsx
          retention-days: 30

  send_email:
    name: "2 Enviar correo con Excel adjunto"
    needs: scrape
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.dry_run != 'true' && needs.scrape.result == 'success' }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Descargar Excel
        uses: actions/download-artifact@v4
        with:
          name: excel-alertas
          path: /tmp/
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Enviar correo con adjunto
        env:
          SMTP_HOST:   ${{ secrets.SMTP_HOST }}
          SMTP_PORT:   ${{ secrets.SMTP_PORT }}
          SMTP_USER:   ${{ secrets.SMTP_USER }}
          SMTP_PASS:   ${{ secrets.SMTP_PASS }}
          TOTAL:       ${{ needs.scrape.outputs.total_alertas }}
          INMEDIATAS:  ${{ needs.scrape.outputs.alertas_inmediatas }}
          PREVENTIVAS: ${{ needs.scrape.outputs.alertas_preventivas }}
          FECHA:       ${{ needs.scrape.outputs.fecha_reporte }}
          EXCEL_NAME:  ${{ needs.scrape.outputs.excel_name }}
          MOTOR:       ${{ needs.scrape.outputs.motor_analisis }}
        run: python3 scripts/send_email.py

  notify_failure:
    name: "3 Notificar fallo"
    needs: [scrape, send_email]
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Enviar alerta de fallo
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py
